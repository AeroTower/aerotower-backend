# Roda todos os testes em cada pull request e em cada push na main.
# Falha se algum teste falhar ou se a cobertura ficar abaixo de 90%.
# O resumo por tipo de teste aparece na aba Actions, e o relatorio de
# cobertura (HTML) fica em Artifacts, como evidencia para o relatorio.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Analise estatica (regras em ruff.toml): import sem uso, raise sem
      # "from", complexidade ciclomatica > 10...
      - name: Analise estatica (ruff)
        run: ruff check --output-format=github .

      # Os testes marcados como "defeito" ficam fora deste passo: eles
      # reproduzem defeitos ainda abertos e falham de proposito.
      - name: Testes e cobertura
        run: >
          pytest -m "not defeito" --cov --cov-report=term-missing --cov-report=xml --cov-report=html
          --junitxml=relatorio-testes.xml

      # Testes individuais que acham defeitos (fichas no TESTES.md). Espera-se
      # que FALHEM enquanto o defeito existir: o passo aparece em vermelho, mas
      # nao derruba o job nem o deploy. O log e o resumo servem de evidencia.
      - name: Testes que acham defeitos (falham de proposito)
        continue-on-error: true
        run: pytest -m defeito -v --no-cov -p no:cacheprovider --junitxml=relatorio-defeitos.xml

      - name: Resumo dos defeitos encontrados
        if: always()
        run: python .github/resumo_defeitos.py relatorio-defeitos.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo por tipo de teste
        if: always()
        run: python tests/resumo_testes.py relatorio-testes.xml coverage.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Evidencias (relatorio de cobertura e resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes-backend
          path: |
            htmlcov/
            relatorio-testes.xml
            relatorio-defeitos.xml
            coverage.xml
