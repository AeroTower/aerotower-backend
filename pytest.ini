[pytest]
testpaths = tests
addopts = -ra
markers =
    unitario: um componente isolado (funcao ou classe), com dubles no lugar do resto
    integracao: componentes conectados (rotas + banco + MQTT falso)
    funcional: fluxos completos pelas rotas, como o app usa
    aceitacao: criterios de aceite das historias de usuario (BDD, arquivos .feature)
    desempenho: carga, volume, pico e escalabilidade
    seguranca: tentativas de ataque e de acesso indevido
    defeito: teste individual que reproduz um defeito ainda aberto (falha de proposito; ver TESTES.md)
filterwarnings =
    ignore::DeprecationWarning
